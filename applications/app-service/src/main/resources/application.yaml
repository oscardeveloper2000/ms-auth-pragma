server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: "ms-auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: "${JWT_KEY_SECRET:c3VwZXJzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXQxMjM0}"
adapters:
  r2dbc:
    host: ${DATABASE_HOST:localhost}
    port: ${DATABASE_PORT:5432}
    database: ${DATABASE_NAME:db-auth}
    schema: ${DATABASE_SCHEMA:public}
    username: ${DATABASE_USER:gestor}
    password: ${DATABASE_PASSWORD:123456}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"

routes:
  paths:
    users: "/api/v1/users"
    usersById: "${routes.paths.users}/{id}"
    usersByDocument: "${routes.paths.users}/document/{documentNumber}"
    getUsersByEmails: "${routes.paths.users}/emails"

springdoc:
  swagger-ui:
    urls:
      - name: users
        url: /openapi/users-api.yaml
jwt:
  secret: "${JWT_KEY_SECRET:c3VwZXJzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXQxMjM0}"
  expiration: 3600000