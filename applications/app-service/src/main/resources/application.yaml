server:
  port: 8080
spring:
  application:
    name: "ms-auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: "c3VwZXJzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXQxMjM0"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "db_auth"
    schema: "public"
    username: "gestor"
    password: "123456"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    users: "/api/v1/users"
    usersById: "${routes.paths.users}/{id}"
    usersByDocument: "${routes.paths.users}/document/{documentNumber}"

springdoc:
  swagger-ui:
    urls:
      - name: users
        url: /openapi/users-api.yaml
jwt:
  secret: "c3VwZXJzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXQxMjM0"
  expiration: 3600000